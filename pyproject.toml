[project]
name = "datapy-gym"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pyspark>=4.1.2",
    "jupyterlab>=4.0.0",
    "chispa>=0.12.0",
    "pandas>=2.0.0",
    "numpy>=2.0.0",
    "ipywidgets>=8.0.0",
    "nbformat>=5.9.0",
    "jupyterlab-code-formatter>=3.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E402", "E501"]  # E402: imports not at top (notebook setup cells); E501: long lines in markdown strings

[tool.ruff.format]
quote-style = "double"
